# syntax=docker/sandbox-kit:3
schemaVersion: "3"
displayName: TMSBX Go
kind: mixin

args:
  version:
    required: true
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: GO_VERSION

provides: ["de.tmsmr/tmsbx-go@${{ kit.args.version }}"]

capabilities:
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            echo 'GOROOT=/usr/local/go' >> /etc/sandbox-persistent.sh
            echo 'GOPATH=$HOME/go' >> /etc/sandbox-persistent.sh
            echo 'PATH=$GOROOT/bin:$GOPATH/bin:$PATH' >> /etc/sandbox-persistent.sh
          user: "agent"
