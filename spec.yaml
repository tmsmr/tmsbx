schemaVersion: "2"
kind: sandbox
name: tmsbx
version: "v0.0.1"
displayName: Thomas' opinionated Sanbox
description: "Docker Sandbox for OpenCode with the toolchains and configurations i like"
sourceURL: https://github.com/tmsmr/tmsbx
licenses:
  - MIT
locked:
  - sandbox.image
security:
  privileged: false

sandbox:
  image: "docker.io/docker/sandbox-templates:shell-docker"

setup:
  install:
    - command: |
        apt update \
          && apt upgrade -y \
          && apt install --no-install-recommends -y \
          wget  \
          silversearcher-ag \
          emacs-nox \
          tmux \
          lsb-release \
          htop \
          && apt clean
