name: TMSBX Kits

on:
  push:
    tags:
      - 'tmsbx/*/*'

jobs:
  kit-validate-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Parse tag and check for kit existence
        run: |
          set -eo pipefail
          
          IFS='/' read -r prefix kit version <<< "$GITHUB_REF_NAME"

          echo "kit: $kit"
          echo "version: $version"
          
          if [ ! -d "$kit" ]; then
            echo "unknown kit"
            exit 1
          fi
          
          echo "TMSBX_KIT=$kit" >> $GITHUB_ENV
          echo "TMXBX_KIT_VERSION=$version" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push kit
        run: |
          docker buildx build \
            --file "$TMSBX_KIT/$TMSBX_KIT.yaml" \
            --build-arg version="$TMXBX_KIT_VERSION" \
            --tag "tmsmr/$TMSBX_KIT:$TMXBX_KIT_VERSION" \
            --platform linux/amd64,linux/arm64 \
            --push \
            "$TMSBX_KIT"
